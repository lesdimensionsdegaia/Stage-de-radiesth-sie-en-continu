<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stage Radiesthésie – Les Dimensions de Gaïa</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--or:#c9a84c;--or2:#e8c97a;--noir:#080d08;--foret:#111a11;--creme:#f4efe6;--txt:#e2ddd5}
html{scroll-behavior:smooth}
body{background:var(--noir);color:var(--txt);font-family:'Cormorant Garamond',serif;overflow-x:hidden}

/* HERO */
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;position:relative;overflow:hidden}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center top;filter:brightness(.3) saturate(.7);animation:zoom 14s ease-out forwards}
@keyframes zoom{to{transform:scale(1.06)}}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,13,8,.3),rgba(8,13,8,.75))}
.hero-c{position:relative;z-index:2;max-width:820px}
.badge{display:inline-block;border:1px solid var(--or);color:var(--or);font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.35em;padding:.4rem 1.5rem;margin-bottom:1.8rem;text-transform:uppercase;animation:up .9s .2s both}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(2.8rem,7vw,5.5rem);font-weight:900;color:var(--creme);line-height:1.05;animation:up .9s .5s both}
.hero h1 em{color:var(--or);font-style:italic}
.hero-sub{font-size:clamp(1rem,2.5vw,1.35rem);font-style:italic;color:rgba(226,221,213,.75);margin:1.5rem 0 2.5rem;line-height:1.65;animation:up .9s .8s both}
.stats{display:flex;justify-content:center;gap:3rem;margin-bottom:2.8rem;flex-wrap:wrap;animation:up .9s 1s both}
.sn{font-family:'Playfair Display',serif;font-size:2.5rem;color:var(--or);font-weight:900;line-height:1}
.sl{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(226,221,213,.45);margin-top:.3rem;font-family:'Cinzel',serif}
.btn-or{display:inline-block;background:linear-gradient(135deg,var(--or),var(--or2),var(--or));color:var(--noir);font-family:'Cinzel',serif;font-size:.85rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;padding:1rem 2.8rem;text-decoration:none;transition:transform .3s,box-shadow .3s;animation:up .9s 1.2s both}
.btn-or:hover{transform:translateY(-3px);box-shadow:0 12px 35px rgba(201,168,76,.4)}
.btn-bord{display:inline-block;border:1px solid var(--or);color:var(--or);font-family:'Cinzel',serif;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;padding:.85rem 2.2rem;text-decoration:none;transition:background .3s,color .3s}
.btn-bord:hover{background:var(--or);color:var(--noir)}

/* SECTIONS */
.sec{padding:6rem 2rem}
.sec-sombre{padding:6rem 2rem;background:var(--foret);position:relative}
.sec-sombre::before,.sec-sombre::after{content:'';position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--or),transparent)}
.sec-sombre::before{top:0}.sec-sombre::after{bottom:0}
.etiq{text-align:center;color:var(--or);font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.4em;text-transform:uppercase;margin-bottom:.7rem}
.titre{font-family:'Playfair Display',serif;font-size:clamp(1.8rem,4.5vw,3rem);text-align:center;color:var(--creme);line-height:1.2;margin-bottom:.6rem}
.titre em{color:var(--or);font-style:italic}
.filet{width:55px;height:1px;background:var(--or);margin:.6rem auto 2.5rem;opacity:.55}
.desc{text-align:center;font-style:italic;color:rgba(226,221,213,.6);font-size:1.05rem;max-width:600px;margin:0 auto 3.5rem;line-height:1.7}

/* GRILLE PHOTOS */
.grille{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:1100px;margin:0 auto}
.photo{overflow:hidden;position:relative;cursor:pointer}
.photo.haut{grid-row:span 2}
.photo.large{grid-column:span 2}
.photo img{width:100%;height:230px;object-fit:cover;display:block;filter:brightness(.8) saturate(.85);transition:filter .5s,transform .5s}
.photo.haut img{height:100%}
.photo:hover img{filter:brightness(1) saturate(1);transform:scale(1.05)}
.photo-legende{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(8,13,8,.88));padding:3rem 1rem .9rem;font-style:italic;font-size:.85rem;color:var(--or2);opacity:0;transition:opacity .3s}
.photo:hover .photo-legende{opacity:1}

/* ABOUT */
.about-grille{max-width:950px;margin:0 auto;display:grid;grid-template-columns:1fr 1.7fr;gap:5rem;align-items:center}
.about-img{position:relative}
.about-img img{width:100%;display:block;filter:brightness(.88) saturate(.85);border-radius:2px}
.about-img::after{content:'';position:absolute;top:1.2rem;left:1.2rem;right:-1.2rem;bottom:-1.2rem;border:1px solid rgba(201,168,76,.38);border-radius:2px;z-index:-1}
.surtitre{display:block;color:var(--or);font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.4em;text-transform:uppercase;margin-bottom:.9rem}
.about-grille h2{font-family:'Playfair Display',serif;font-size:clamp(1.6rem,3vw,2.5rem);color:var(--creme);line-height:1.2;margin-bottom:1.1rem}
.about-grille p{font-size:1rem;line-height:1.9;color:rgba(226,221,213,.78);margin-bottom:1rem}
.tags{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.2rem}
.tag{border:1px solid rgba(201,168,76,.35);color:var(--or);font-size:.68rem;letter-spacing:.08em;padding:.28rem .8rem;border-radius:20px}

/* PROGRAMME */
.prog-grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:1.2rem;max-width:1100px;margin:0 auto}
.prog-carte{background:linear-gradient(135deg,rgba(21,32,21,.7),rgba(8,13,8,.5));border:1px solid rgba(201,168,76,.18);padding:1.8rem;border-radius:2px;transition:border-color .3s,transform .3s;position:relative;overflow:hidden}
.prog-carte::before{content:'';position:absolute;top:0;left:0;width:3px;height:0;background:var(--or);transition:height .4s}
.prog-carte:hover{border-color:rgba(201,168,76,.45);transform:translateY(-4px)}
.prog-carte:hover::before{height:100%}
.prog-carte .icone{font-size:1.8rem;margin-bottom:.7rem}
.prog-carte h3{font-family:'Playfair Display',serif;font-size:1.12rem;color:var(--or2);margin-bottom:.55rem}
.prog-carte p{font-size:.9rem;line-height:1.7;color:rgba(226,221,213,.65)}

/* CERTS */
.certs-row{display:flex;gap:1.2rem;max-width:1100px;margin:0 auto;overflow-x:auto;padding-bottom:.8rem;scrollbar-width:thin;scrollbar-color:var(--or) transparent}
.cert{flex:0 0 270px}
.cert img{width:100%;display:block;border-radius:3px;box-shadow:0 8px 28px rgba(0,0,0,.55);transition:transform .3s,box-shadow .3s}
.cert:hover img{transform:scale(1.03) rotate(.8deg);box-shadow:0 15px 45px rgba(201,168,76,.2)}

/* TARIF */
.tarif-box{max-width:580px;margin:3.5rem auto 0;border:1px solid var(--or);padding:3.5rem 3rem;text-align:center;background:linear-gradient(135deg,rgba(21,32,21,.5),rgba(8,13,8,.4));position:relative}
.tarif-box::before{content:'✦';position:absolute;top:-.9rem;left:50%;transform:translateX(-50%);background:var(--noir);padding:0 1rem;color:var(--or);font-size:1.1rem}
.prix{font-family:'Playfair Display',serif;font-size:clamp(3rem,8vw,5.5rem);color:var(--or);font-weight:900;line-height:1}
.prix-desc{font-style:italic;color:rgba(226,221,213,.65);margin:1rem 0 2rem;line-height:1.6;font-size:1.05rem}
.prix-liste{list-style:none;text-align:left;margin-bottom:2.5rem}
.prix-liste li{padding:.55rem 0;border-bottom:1px solid rgba(201,168,76,.1);font-size:.97rem;color:rgba(226,221,213,.78);display:flex;gap:.7rem;align-items:center}
.prix-liste li::before{content:'◆';color:var(--or);font-size:.45rem;flex-shrink:0}

/* DIAPORAMA */
.diapo{max-width:880px;margin:2.8rem auto 0;position:relative;overflow:hidden;border-radius:3px;box-shadow:0 20px 65px rgba(0,0,0,.65)}
.diapo-slides{display:flex;transition:transform .85s cubic-bezier(.77,0,.18,1)}
.diapo-slide{flex:0 0 100%;position:relative}
.diapo-slide img{width:100%;height:460px;object-fit:cover;display:block}
.diapo-legende{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(8,13,8,.9));padding:3.5rem 2rem 1.2rem;font-style:italic;color:var(--or2);text-align:center;font-size:1rem}
.diapo-prev,.diapo-next{position:absolute;top:50%;transform:translateY(-50%);background:rgba(8,13,8,.6);border:1px solid var(--or);color:var(--or);width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:1.3rem;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s;z-index:5}
.diapo-prev{left:.8rem}.diapo-next{right:.8rem}
.diapo-prev:hover,.diapo-next:hover{background:var(--or);color:var(--noir)}
.diapo-points{display:flex;justify-content:center;gap:7px;margin-top:.8rem}
.diapo-points span{width:8px;height:8px;border-radius:50%;background:rgba(201,168,76,.3);cursor:pointer;transition:background .3s,transform .3s}
.diapo-points span.actif{background:var(--or);transform:scale(1.3)}
.barre-prog{position:absolute;bottom:0;left:0;height:3px;background:linear-gradient(90deg,var(--or),var(--or2));width:0;z-index:5}

/* CTA FINAL */
.final{padding:7rem 2rem;text-align:center;background:linear-gradient(180deg,var(--noir),var(--foret))}
.final h2{font-family:'Playfair Display',serif;font-size:clamp(2rem,5vw,3.5rem);color:var(--creme);margin-bottom:1.2rem;line-height:1.2}
.final h2 em{color:var(--or);font-style:italic}
.final p{font-style:italic;color:rgba(226,221,213,.65);font-size:1.1rem;max-width:560px;margin:0 auto 2.8rem;line-height:1.7}
.btn-groupe{display:flex;gap:1.2rem;justify-content:center;flex-wrap:wrap;margin-bottom:3rem}
.liens-sites{display:flex;gap:2rem;justify-content:center;flex-wrap:wrap}
.liens-sites a{color:rgba(226,221,213,.35);text-decoration:none;font-size:.8rem;transition:color .2s}
.liens-sites a:hover{color:var(--or)}
footer{padding:2.5rem;text-align:center;border-top:1px solid rgba(201,168,76,.12)}
footer p{font-size:.78rem;color:rgba(226,221,213,.3);margin:.2rem 0}
footer a{color:var(--or);text-decoration:none}

@keyframes up{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .7s,transform .7s}
.reveal.visible{opacity:1;transform:translateY(0)}

@media(max-width:768px){
  .grille{grid-template-columns:1fr 1fr}
  .photo.haut,.photo.large{grid-row:span 1;grid-column:span 1}
  .about-grille{grid-template-columns:1fr;gap:2.5rem}
  .about-img::after{display:none}
  .stats{gap:1.5rem}
  .tarif-box{padding:2rem 1.2rem}
}
</style>
</head>
